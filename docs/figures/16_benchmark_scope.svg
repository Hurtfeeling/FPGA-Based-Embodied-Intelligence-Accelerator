<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="750" viewBox="0 0 1320 750">
<rect width="100%" height="100%" fill="white"/>
<text x="660.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">CPU 单核三核的计时边界</text>
<text x="660.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">对照采用相同输入与输出校验；一次性初始化和每任务端到端时间分别报告</text>
<rect x="45" y="135" width="1230" height="85" rx="12" fill="#f2f4f6" stroke="#677584" stroke-width="2"/>
<text x="660.0" y="185.42" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="22" fill="#677584" font-weight="700" text-anchor="middle">一次性初始化：加载 bit / HWH、发现设备、申请并持有物理内存</text>
<rect x="35" y="330" width="190" height="125" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="130.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#23608b" font-weight="700" text-anchor="middle">准备</text>
<text x="130.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">生成或复制 A / B</text>
<polyline points="225,392 240,392" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="240,392 230.09508187412055,396.78462087522354 230.09508187412055,387.21537912477646" fill="#526274"/>
<rect x="250" y="330" width="190" height="125" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="345.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#23608b" font-weight="700" text-anchor="middle">转置</text>
<text x="345.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">B → 连续 BT</text>
<polyline points="440,392 455,392" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,392 445.0950818741206,396.78462087522354 445.0950818741206,387.21537912477646" fill="#526274"/>
<rect x="465" y="330" width="190" height="125" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="560.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#23608b" font-weight="700" text-anchor="middle">同步</text>
<text x="560.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">CPU → PL</text>
<polyline points="655,392 670,392" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="670,392 660.0950818741205,396.78462087522354 660.0950818741205,387.21537912477646" fill="#526274"/>
<rect x="680" y="330" width="190" height="125" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="775.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#186b61" font-weight="700" text-anchor="middle">配置</text>
<text x="775.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">分区、MMIO、START</text>
<polyline points="870,392 885,392" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="885,392 875.0950818741205,396.78462087522354 875.0950818741205,387.21537912477646" fill="#526274"/>
<rect x="895" y="330" width="190" height="125" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="990.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#186b61" font-weight="700" text-anchor="middle">等待</text>
<text x="990.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">计算 + 完整写回</text>
<polyline points="1085,392 1100,392" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="1100,392 1090.0950818741205,396.78462087522354 1090.0950818741205,387.21537912477646" fill="#526274"/>
<rect x="1110" y="330" width="190" height="125" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="1205.0" y="365.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#186b61" font-weight="700" text-anchor="middle">结果</text>
<text x="1205.0" y="416.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">PL → CPU、取得 C</text>
<polyline points="45,495 1275,495" fill="none" stroke="#9a5a13" stroke-width="3"/>
<text x="660" y="541.84" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="19" fill="#9a5a13" font-weight="700" text-anchor="middle">每任务端到端：外层计时覆盖以上全部阶段；分项计时用于定位开销</text>
<text x="660" y="616.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="middle">三核任务组：首个 START 发出 → 最后一个核确认写回；每核硬件周期另列，不把三核周期相加</text>
<text x="660" y="671.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="middle">权重已转置且常驻时另列一个测试场景；不能省掉软件开销后称为端到端加速比</text>
</svg>