<text x="1022.5" y="560.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#9a5a13" font-weight="700" text-anchor="middle">推进与结果读出</text>
<text x="1022.5" y="597.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">advance 时数据与有效标志逐级推进</text>
<text x="1022.5" y="620.9399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">完成填充和排空后读出结果行</text>
<text x="660" y="751.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="middle">A 沿行向右传播，B 沿列向下传播；输入错位及 valid 对齐使同一 k 的数据在 PE 相遇</text>
<text x="660" y="796.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="middle">K 拍有效输入不等于完整任务只需 K 拍；任务还包含存储读取、填充、排空、输出及总线等待</text>
