<rect x="1045" y="125" width="175" height="85" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="1132.5" y="173.98" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#23608b" font-weight="700" text-anchor="middle">后续条带 …</text>
<rect x="245" y="280" width="175" height="95" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="332.5" y="314.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#23608b" font-weight="700" text-anchor="middle">a0 完整提交</text>
<text x="332.5" y="351.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">a0_ready = 1</text>
<rect x="445" y="280" width="175" height="95" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="532.5" y="314.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#186b61" font-weight="700" text-anchor="middle">bt0 完整提交</text>
<text x="532.5" y="351.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">bt0_ready = 1</text>
