<text x="940.0" y="314.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#677584" font-weight="700" text-anchor="middle">a1、bt1 等陆续提交</text>
<text x="940.0" y="351.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">仅实际写入存储后才发布可计算状态</text>
<polyline points="332,210 332,265" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="332,265 327.21537912477646,255.09508187412055 336.78462087522354,255.09508187412055" fill="#526274"/>
<polyline points="532,210 532,265" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="532,265 527.2153791247765,255.09508187412055 536.7846208752235,255.09508187412055" fill="#526274"/>
<rect x="445" y="440" width="410" height="100" rx="12" fill="#fff4e3" stroke="#9a5a13" stroke-width="2"/>
<text x="650.0" y="474.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#9a5a13" font-weight="700" text-anchor="middle">a0 × bt0^T → 一个 32×32 微块</text>
<text x="650.0" y="514.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">两侧输入就绪、输出槽可用时启动</text>
<polyline points="532,375 532,425" fill="none" stroke="#9a5a13" stroke-width="2"/>
<polygon points="532,425 527.2153791247765,415.0950818741206 536.7846208752235,415.0950818741206" fill="#9a5a13"/>
<rect x="910" y="440" width="290" height="100" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="1055.0" y="474.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#23608b" font-weight="700" text-anchor="middle">继续选取就绪组合</text>
<text x="1055.0" y="514.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">已经计算的条带对不重复计算</text>
<polyline points="855,490 895,490" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="895,490 885.0950818741205,494.78462087522354 885.0950818741205,485.21537912477646" fill="#526274"/>
<text x="660" y="621.84" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="19" fill="#17232f" font-weight="700" text-anchor="middle">计算 a0 × bt0^T 时，读引擎仍可加载后续条带，Writer 可回写前面的结果</text>
<text x="660" y="671.48" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#526274" font-weight="400" text-anchor="middle">单个读引擎顺序传输 A / BT；输入不必等待整个 256 行宏条带全部装满</text>
</svg>