<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740">
<rect width="100%" height="100%" fill="white"/>
<text x="660.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">条带就绪与加载计算重叠</text>
<text x="660.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">示意事件顺序，横向宽度不表示实测周期；K=2048 时一条输入为 32×2048 = 64 KiB</text>
<text x="60" y="172.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#17232f" font-weight="700" text-anchor="start">AXI 读引擎</text>
