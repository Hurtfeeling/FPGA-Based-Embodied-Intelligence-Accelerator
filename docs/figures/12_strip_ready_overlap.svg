<text x="732.5" y="173.98" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="18" fill="#23608b" font-weight="700" text-anchor="middle">A 条带 a1</text>
<polyline points="820,167 835,167" fill="none" stroke="#526274" stroke-width="2"/>
