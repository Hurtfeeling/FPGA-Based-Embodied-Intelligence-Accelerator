<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="800" viewBox="0 0 1380 800">
<rect width="100%" height="100%" fill="white"/>
<text x="690.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">四路 FP32 Softmax 数据通路</text>
<text x="690.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">稳定 Softmax：加载求最大值 → 指数与求和 → 归一化 → DDR 写回</text>
<rect x="35" y="120" width="230" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="150.0" y="155.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">DDR 输入</text>
<text x="150.0" y="189.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">128 位 / beat</text>
<text x="150.0" y="213.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">4 个 FP32 元素</text>
<rect x="335" y="120" width="320" height="115" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="495.0" y="155.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">输入行 BRAM 16 KiB</text>
<text x="495.0" y="189.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">4 个 1024×32 位 bank</text>
<text x="495.0" y="213.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">加载同时更新最大值 m</text>
<rect x="745" y="120" width="570" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="1030.0" y="155.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">4 路减法与指数流水</text>
<text x="1030.0" y="189.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">z = x − m；exp(z)</text>
<text x="1030.0" y="213.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">log2(e) 乘法 + 1024 段 ROM 线性插值</text>
<polyline points="265,177 320,177" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="320,177 310.0950818741206,181.78462087522354 310.0950818741206,172.21537912477646" fill="#526274"/>
<polyline points="655,177 730,177" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="730,177 720.0950818741205,181.78462087522354 720.0950818741205,172.21537912477646" fill="#526274"/>
<rect x="745" y="330" width="570" height="115" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="1030.0" y="365.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">输出行 BRAM 16 KiB</text>
<text x="1030.0" y="399.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">先写 e；归一化后原位保存 p</text>
<text x="1030.0" y="423.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">4 个 1024×32 位 bank</text>
<polyline points="1030,235 1030,315" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="1030,315 1025.2153791247765,305.0950818741206 1034.7846208752235,305.0950818741206" fill="#526274"/>
<rect x="35" y="330" width="570" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="320.0" y="365.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">4 路对齐与进位保存求和</text>
<text x="320.0" y="399.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">UQ16.48 → CSA 归约 → 行末完整加法</text>
<text x="320.0" y="423.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">得到 S = Σ exp(x − m)</text>
<polyline points="745,210 700,210 700,280 320,280 320,315" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="320,315 315.21537912477646,305.0950818741206 324.78462087522354,305.0950818741206" fill="#526274"/>
<rect x="35" y="540" width="285" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="177.5" y="575.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">每行一次倒数</text>
<text x="177.5" y="621.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">r = 1 / S</text>
<polyline points="180,445 180,525" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="180,525 175.21537912477646,515.0950818741205 184.78462087522354,515.0950818741205" fill="#526274"/>
<rect x="415" y="540" width="430" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="630.0" y="575.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">4 路 FP32 归一化</text>
<text x="630.0" y="609.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">读取 e，计算 p = e × r</text>
<text x="630.0" y="633.4399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">结果写回输出行 BRAM</text>
<polyline points="320,597 400,597" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="400,597 390.0950818741206,601.7846208752235 390.0950818741206,592.2153791247765" fill="#526274"/>
<polyline points="850,445 850,490 630,490 630,525" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="630,525 625.2153791247765,515.0950818741205 634.7846208752235,515.0950818741205" fill="#526274"/>
<polyline points="845,597 880,597 880,445 900,445" fill="none" stroke="#186b61" stroke-width="2"/>
<polygon points="900,445 890.0950818741205,449.78462087522354 890.0950818741205,440.21537912477646" fill="#186b61"/>
<rect x="1030" y="540" width="285" height="115" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="1172.5" y="575.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">TX 队列与 AXI 写回</text>
<text x="1172.5" y="609.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">读出概率 p</text>
<text x="1172.5" y="633.4399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">最终等待 B 响应</text>
<polyline points="1170,445 1170,525" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="1170,525 1165.2153791247765,515.0950818741205 1174.7846208752235,515.0950818741205" fill="#526274"/>
<text x="690" y="731.84" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="19" fill="#526274" font-weight="400" text-anchor="middle">行间重叠：EXP(n) 与 LOAD(n+1)；STORE(n) 可与 EXP(n+1) 重叠</text>
<text x="690" y="770.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">地址安全读出后才允许覆盖；本图为逻辑关系，不表示所有阶段同拍启动</text>
</svg>