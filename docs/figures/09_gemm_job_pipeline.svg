<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790">
<rect width="100%" height="100%" fill="white"/>
<text x="660.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">一个 GEMM 任务从提交到完整写回</text>
<text x="660.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">软件只提交地址和尺寸；硬件自行分块、加载、选取就绪条带、计算和写回</text>
<rect x="45" y="135" width="370" height="150" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="230.0" y="170.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">1  参数检查与接收</text>
<text x="230.0" y="222.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">32 字节对齐、维度与范围检查</text>
<text x="230.0" y="245.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">锁存参数；ACCEPTED_JOB 递增</text>
<polyline points="415,210 460,210" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="460,210 450.0950818741206,214.78462087522354 450.0950818741206,205.21537912477646" fill="#526274"/>
<rect x="475" y="135" width="370" height="150" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="660.0" y="170.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">2  宏块路径规划</text>
<text x="660.0" y="222.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">按 K 与缓存容量计算宏块</text>
<text x="660.0" y="245.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">比较四条蛇形路径的读取量</text>
<polyline points="845,210 890,210" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="890,210 880.0950818741205,214.78462087522354 880.0950818741205,205.21537912477646" fill="#526274"/>
<rect x="905" y="135" width="370" height="150" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="1090.0" y="170.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">3  条带加载与发布</text>
<text x="1090.0" y="222.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">未命中的 A / BT 交替读取</text>
<text x="1090.0" y="245.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">实际写入存储后设置 ready</text>
<rect x="45" y="395" width="370" height="150" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="230.0" y="430.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">4  就绪输入对计算</text>
<text x="230.0" y="482.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">从 ready 条带中选择未算组合</text>
<text x="230.0" y="505.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">32×32 PE 送数、累加、排空</text>
<polyline points="415,470 460,470" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="460,470 450.0950818741206,474.78462087522354 450.0950818741206,465.21537912477646" fill="#526274"/>
<rect x="475" y="395" width="370" height="150" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="660.0" y="430.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">5  C 输出槽与 Writer</text>
<text x="660.0" y="482.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">记录绝对输出坐标</text>
<text x="660.0" y="505.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">达到水位即可开始回写</text>
<polyline points="845,470 890,470" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="890,470 880.0950818741205,474.78462087522354 880.0950818741205,465.21537912477646" fill="#526274"/>
<rect x="905" y="395" width="370" height="150" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="1090.0" y="430.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">6  任务完成与回收</text>
<text x="1090.0" y="482.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">等待队列、DMA 与 B 响应排空</text>
<text x="1090.0" y="505.94" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">更新完成编号和周期快照</text>
<polyline points="1090,285 1090,345 230,345 230,380" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="230,380 225.21537912477646,370.0950818741206 234.78462087522354,370.0950818741206" fill="#526274"/>
<rect x="85" y="650" width="1150" height="70" rx="12" fill="#fff4e3" stroke="#9a5a13" stroke-width="2"/>
<text x="660.0" y="692.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#9a5a13" font-weight="700" text-anchor="middle">第 3、4、5 阶段可在条件允许时重叠；错误路径先排空已接受事务再返回</text>
</svg>