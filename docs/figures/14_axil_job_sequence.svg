<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850">
<rect width="100%" height="100%" fill="white"/>
<text x="660.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">AXI Lite 寄存器控制与任务编号</text>
<text x="660.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">每核使用独立的控制窗口；示例基址 0x80000000，CTRL 写入产生命令脉冲</text>
<rect x="45" y="145" width="370" height="155" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="230.0" y="180.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">空闲与版本检查</text>
<text x="230.0" y="234.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">CAP_CONFIG = 0x0A080020</text>
<text x="230.0" y="258.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">BUSY = 0，WRITE_BUSY = 0</text>
<polyline points="415,222 460,222" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="460,222 450.0950818741206,226.78462087522354 450.0950818741206,217.21537912477646" fill="#526274"/>
<rect x="475" y="145" width="370" height="155" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="660.0" y="180.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">清除旧状态</text>
<text x="660.0" y="234.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">CTRL ← 0x201</text>
<text x="660.0" y="258.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">ENABLE | CLEAR_STATUS</text>
<polyline points="845,222 890,222" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="890,222 880.0950818741205,226.78462087522354 880.0950818741205,217.21537912477646" fill="#526274"/>
<rect x="905" y="145" width="370" height="155" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="1090.0" y="180.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">写入矩阵参数</text>
<text x="1090.0" y="234.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">A_BASE / BT_BASE / C_BASE</text>
<text x="1090.0" y="258.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">DIM_MN / DIM_K 按 32 编码</text>
<rect x="45" y="405" width="370" height="155" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="230.0" y="440.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">记录预期任务并启动</text>
<text x="230.0" y="494.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">读取旧 ACCEPTED_JOB</text>
<text x="230.0" y="518.4399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">CTRL ← 0x101</text>
<polyline points="415,482 460,482" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="460,482 450.0950818741206,486.78462087522354 450.0950818741206,477.21537912477646" fill="#526274"/>
<rect x="475" y="405" width="370" height="155" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="660.0" y="440.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">轮询当前任务</text>
<text x="660.0" y="494.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">ACCEPTED_JOB 匹配预期</text>
<text x="660.0" y="518.4399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">BUSY / WRITE_BUSY 归零</text>
<polyline points="845,482 890,482" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="890,482 880.0950818741205,486.78462087522354 880.0950818741205,477.21537912477646" fill="#526274"/>
<rect x="905" y="405" width="370" height="155" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="1090.0" y="440.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">确认完整写回</text>
<text x="1090.0" y="494.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">WRITE_DONE = 1</text>
<text x="1090.0" y="518.4399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">WRITE_DONE_JOB 匹配预期</text>
<polyline points="1090,300 1090,350 230,350 230,390" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="230,390 225.21537912477646,380.0950818741206 234.78462087522354,380.0950818741206" fill="#526274"/>
<rect x="85" y="665" width="1150" height="95" rx="12" fill="#fff4e3" stroke="#9a5a13" stroke-width="2"/>
<text x="660.0" y="700.56" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="21" fill="#9a5a13" font-weight="700" text-anchor="middle">失败或超时：保留任务句柄与输入输出内存</text>
<text x="660.0" y="736.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">超时不会取消 AXI 访问；硬件 ERROR 后仍等待在途事务排空，再决定下一步恢复</text>
</svg>