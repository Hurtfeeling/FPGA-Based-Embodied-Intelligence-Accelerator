<text x="265" y="398.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">…</text>
<rect x="70" y="415" width="390" height="45" rx="0" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="265" y="443.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">…</text>
<rect x="70" y="460" width="390" height="45" rx="0" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="265" y="488.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">…</text>
