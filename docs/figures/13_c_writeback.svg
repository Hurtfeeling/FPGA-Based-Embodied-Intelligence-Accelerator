<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880">
<rect width="100%" height="100%" fill="white"/>
<text x="660.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">C 微块的 DDR 行跨度与 burst 写回</text>
<text x="660.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">一个 32×32 INT32 微块共 4 KiB；它在完整 M×N 输出矩阵中通常不是一段连续的 4 KiB</text>
<text x="265" y="147.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">片上一个输出槽：32×32 INT32</text>
<rect x="70" y="190" width="390" height="45" rx="0" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="265" y="218.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">32 个 INT32 = 128 B</text>
