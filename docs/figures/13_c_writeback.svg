<text x="265" y="308.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">32 个 INT32 = 128 B</text>
<rect x="70" y="325" width="390" height="45" rx="0" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
