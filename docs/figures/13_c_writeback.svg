<text x="265" y="533.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#23608b" font-weight="400" text-anchor="middle">共 32 行</text>
<text x="985" y="147.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">DDR 中的 C：每行跨度 N×4 字节</text>
<rect x="720" y="190" width="540" height="40" rx="0" fill="#f2f4f6" stroke="#677584" stroke-width="2"/>
<rect x="830" y="190" width="180" height="40" rx="0" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="920" y="215.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#186b61" font-weight="400" text-anchor="middle">本微块的 128 B</text>
<text x="691" y="215.4" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="15" fill="#526274" font-weight="400" text-anchor="middle">0</text>
<rect x="720" y="253" width="540" height="40" rx="0" fill="#f2f4f6" stroke="#677584" stroke-width="2"/>
