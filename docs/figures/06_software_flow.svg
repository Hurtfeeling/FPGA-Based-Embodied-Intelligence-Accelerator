<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="920" viewBox="0 0 1250 920">
<rect width="100%" height="100%" fill="white"/>
<text x="625.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">软件控制与任务执行流程</text>
<text x="625.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">当前三核驱动接收物理地址；内存准备和缓存同步由调用方负责</text>
<rect x="65" y="108" width="780" height="94" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="455.0" y="143.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">加载 bit / HWH</text>
<text x="455.0" y="179.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">应用调用 PYNQ Overlay；驱动解析地址与版本</text>
<polyline points="455,202 455,226" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,226 450.21537912477646,216.09508187412055 459.78462087522354,216.09508187412055" fill="#526274"/>
<rect x="65" y="233" width="780" height="94" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="455.0" y="268.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">准备数据与有效物理内存</text>
<text x="455.0" y="304.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">B 转置为 BT；地址与布局检查；CPU → PL 同步</text>
<polyline points="455,327 455,351" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,351 450.21537912477646,341.0950818741206 459.78462087522354,341.0950818741206" fill="#526274"/>
<rect x="65" y="358" width="780" height="94" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="455.0" y="393.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">选择核心与配置任务</text>
<text x="455.0" y="429.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">单核 / 按 32 行块分区 / 独立无依赖任务</text>
<polyline points="455,452 455,476" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,476 450.21537912477646,466.0950818741206 459.78462087522354,466.0950818741206" fill="#526274"/>
<rect x="65" y="483" width="780" height="94" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="455.0" y="518.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">提交 START 并登记任务</text>
<text x="455.0" y="554.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">连续启动多个核；保留输入输出内存所有权</text>
<polyline points="455,577 455,601" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,601 450.21537912477646,591.0950818741205 459.78462087522354,591.0950818741205" fill="#526274"/>
<rect x="65" y="608" width="780" height="94" rx="12" fill="#eaf3fa" stroke="#23608b" stroke-width="2"/>
<text x="455.0" y="643.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#23608b" font-weight="700" text-anchor="middle">查询状态并确认完整写回</text>
<text x="455.0" y="679.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">等待任务完成、队列排空及最终 AXI B 响应</text>
<polyline points="455,702 455,726" fill="none" stroke="#526274" stroke-width="2"/>
<polygon points="455,726 450.21537912477646,716.0950818741205 459.78462087522354,716.0950818741205" fill="#526274"/>
<rect x="65" y="733" width="780" height="94" rx="12" fill="#eaf5f0" stroke="#186b61" stroke-width="2"/>
<text x="455.0" y="768.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#186b61" font-weight="700" text-anchor="middle">同步、校验并回收任务</text>
<text x="455.0" y="804.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">PL → CPU 可见；读取结果与统计；后续再复用内存</text>
<rect x="915" y="430" width="285" height="220" rx="12" fill="#fff4e3" stroke="#9a5a13" stroke-width="2"/>
<text x="1057.5" y="465.2" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="20" fill="#9a5a13" font-weight="700" text-anchor="middle">错误 / 超时处理</text>
<text x="1057.5" y="528.26" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">停止新依赖任务</text>
<text x="1057.5" y="551.9399999999999" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">确认在途事务状态</text>
<text x="1057.5" y="575.62" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">排空或按系统流程恢复</text>
<text x="1057.5" y="599.3" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">未确认前禁止释放内存</text>
<polyline points="845,655 885,655 885,540 900,540" fill="none" stroke="#9a5a13" stroke-width="2"/>
<polygon points="900,540 890.0950818741205,544.7846208752235 890.0950818741205,535.2153791247765" fill="#9a5a13"/>
<text x="625" y="891.12" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="middle">主机侧控制检查、RTL 仿真和板端运行分别留存验证记录</text>
</svg>