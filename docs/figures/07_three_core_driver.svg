<text x="190.0" y="184.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">A / BT / C 与 M / N / K</text>
<text x="190.0" y="208.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">持有内存并完成数据同步</text>
