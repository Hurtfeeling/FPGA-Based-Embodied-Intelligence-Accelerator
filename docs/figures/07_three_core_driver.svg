<text x="650.0" y="184.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">submit_gemm_rows(..., cores=(0,1,2))</text>
<text x="650.0" y="208.44" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#17232f" font-weight="400" text-anchor="middle">按 32 行切分，检查地址及任务冲突</text>
