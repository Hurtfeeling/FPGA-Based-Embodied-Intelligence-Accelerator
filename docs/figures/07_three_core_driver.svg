<text x="680" y="1013.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">三个输出区连续覆盖 C，无需 CPU 拼接；共享 HP0，实际加速比由板端测试获得</text>
