<text x="680.0" y="39.72" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#17232f" font-weight="700" text-anchor="middle">Python 驱动提交 GEMM 三核协同计算</text>
<text x="680.0" y="71.76" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="16" fill="#526274" font-weight="400" text-anchor="middle">同一矩阵按 M 行分块，三个独立 GEMM 核共享只读 BT</text>
